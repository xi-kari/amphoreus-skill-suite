<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪卡画廊 · 翁法罗斯 Skill 套件</title>
<meta name="description" content="逐火者的命录 · 分层立体闪卡:底片 / 框窗人物 / 徽记三层视差 + 全息箔光。">
<link rel="icon" href="assets/symbols/trailblazer-stelle.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--panel:#161a26;--line:#2a2f3e;--gold:#e3b341;--gold2:#caa14a;--parch:#f2e7cd;--ink:#c9cfdd;--dim:#8b93a7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;line-height:1.7;overflow-x:hidden;
  background-image:radial-gradient(900px 420px at 50% -8%,rgba(227,179,65,.12),transparent 60%),
   radial-gradient(2px 2px at 16% 28%,rgba(242,231,205,.45),transparent 60%),
   radial-gradient(1.5px 1.5px at 78% 16%,rgba(242,231,205,.35),transparent 60%),
   radial-gradient(2px 2px at 34% 68%,rgba(242,231,205,.2),transparent 60%)}
h1,h2{font-family:'Noto Serif SC',serif;color:var(--parch)}
a{color:var(--gold);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header{padding:54px 0 8px;text-align:center}
header .back{font-size:.85rem;color:var(--dim)}
header .back:hover{color:var(--gold)}
h1{font-size:clamp(1.9rem,4.6vw,3rem);font-weight:900;letter-spacing:.08em;margin-top:14px}
.sub{color:var(--dim);font-size:.92rem;max-width:640px;margin:14px auto 0}
.ctrl{margin:26px 0 8px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tbtn{border:1px solid var(--gold2);background:transparent;color:var(--gold);border-radius:999px;
  padding:8px 22px;font-size:.85rem;cursor:pointer;font-family:inherit;transition:all .25s}
.tbtn:hover{background:rgba(227,179,65,.12)}
.tbtn.on{background:linear-gradient(135deg,var(--gold),#b78528);color:#151000;font-weight:700}
.legend{display:none;font-size:.78rem;color:var(--dim);text-align:center;margin-top:6px}
body.explode .legend{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:34px 26px;padding:44px 0 70px}
.slot{text-align:center}
.cap{margin-top:14px;font-size:.9rem;color:var(--parch)}
.cap .t{color:var(--gold2);font-size:.76rem;letter-spacing:.14em}
.cap code{display:block;margin-top:3px;font-size:.72rem;color:var(--dim)}

.hcard{position:relative;aspect-ratio:640/1123;width:100%;cursor:pointer;
  perspective:900px;-webkit-tap-highlight-color:transparent}
.layers{position:absolute;inset:0;transform-style:preserve-3d;border-radius:4.4%/2.6%;
  transition:transform .55s cubic-bezier(.2,.8,.25,1);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.hcard.live .layers{transition:transform .08s linear}
.l{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
img.l{width:100%;height:100%;object-fit:cover}
.l.base{transform:translateZ(-40px) scale(1.14) translate(calc(var(--dx,0)*-9px),calc(var(--dy,0)*-7px))}
.l.front{transform:translateZ(30px) scale(1.005) translate(calc(var(--dx,0)*8px),calc(var(--dy,0)*6px));
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
img.coin{position:absolute;left:50%;top:1.1%;width:19.5%;height:auto;aspect-ratio:1;border-radius:50%;
  margin-left:-9.75%;transform:translateZ(64px) translate(calc(var(--dx,0)*15px),calc(var(--dy,0)*11px));
  box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 14px rgba(227,179,65,.35);pointer-events:none}
.l.foil{mix-blend-mode:color-dodge;opacity:calc(var(--o,0)*.9);transform:translateZ(34px);
  background:
   repeating-linear-gradient(115deg,rgba(255,60,60,.16) 0%,rgba(255,220,90,.2) 6%,rgba(90,255,150,.16) 12%,rgba(80,200,255,.2) 18%,rgba(190,90,255,.16) 24%,rgba(255,60,60,.16) 30%),
   radial-gradient(farthest-corner circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55) 4%,rgba(255,255,255,.12) 26%,transparent 60%);
  background-size:280% 280%,100% 100%;
  background-position:calc(var(--fx,50%)) calc(var(--fy,50%)),0 0}
.l.spark{mix-blend-mode:screen;opacity:calc(var(--o,0)*.75);transform:translateZ(40px);
  background:url(assets/layers/sparkle.png) repeat;background-size:190px;
  background-position:calc(var(--dx,0)*-26px) calc(var(--dy,0)*-20px)}
.l.glare{mix-blend-mode:overlay;opacity:calc(var(--o,0)*.95);transform:translateZ(46px);
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.5) 0%,rgba(255,255,255,.08) 32%,transparent 55%)}
.l.rim{box-shadow:inset 0 0 0 1px rgba(227,179,65,.5),inset 0 0 26px rgba(227,179,65,.12),0 22px 50px rgba(0,0,0,.55);
  transform:translateZ(48px)}
@keyframes sway{0%,100%{transform:rotateX(2.2deg) rotateY(-3.6deg)}50%{transform:rotateX(-2.2deg) rotateY(3.6deg)}}
.hcard:not(.live):not(.still) .layers{animation:sway 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.hcard .layers{animation:none!important}}

/* 拆层视图 */
body.explode .hcard .layers{animation:none;transform:rotateX(22deg) rotateY(-16deg)}
body.explode .l.base{transform:translateZ(-110px) scale(1.02);outline:1px dashed rgba(227,179,65,.55);outline-offset:-1px}
body.explode .l.front{transform:translateZ(30px);outline:1px dashed rgba(140,220,255,.5);outline-offset:-1px}
body.explode img.coin{transform:translateZ(170px)}
body.explode .l.foil,body.explode .l.spark,body.explode .l.glare{opacity:0}
body.explode .l.rim{opacity:.25}

/* 放大查看 */
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.86);backdrop-filter:blur(6px);z-index:50;
  display:none;align-items:center;justify-content:center}
.overlay.on{display:flex}
.overlay .stage{width:min(88vw,400px)}
.overlay .hint{text-align:center;color:var(--dim);font-size:.78rem;margin-top:16px}
footer{border-top:1px solid var(--line);padding:34px 0 46px;text-align:center;font-size:.78rem;color:var(--dim)}
</style>
</head>
<body>
<header class="wrap">
  <a class="back" href="index.html">← 返回介绍页</a>
  <h1>闪卡画廊</h1>
  <p class="sub">「逐火者的命录」十五张卡面,每张拆为 <b style="color:var(--gold)">底片 / 框窗人物 / 徽记</b> 三层——移动指针(或触摸拖动)倾斜卡片,窗内景深与全息箔光随之流动;点按卡片放大把玩。</p>
  <div class="ctrl">
    <button class="tbtn" id="explodeBtn">拆层视图</button>
    <a class="tbtn" href="https://github.com/xi-kari/amphoreus-skill-suite/blob/main/tools/make_layers.py">分层管线 ↗</a>
  </div>
  <div class="legend">金虚线=底片层(完整卡面) · 蓝虚线=前景层(边框+人物,拱窗透空) · 悬浮圆=徽记层</div>
</header>

<main class="wrap"><div class="grid" id="grid"></div></main>

<div class="overlay" id="overlay"><div>
  <div class="stage" id="stage"></div>
  <div class="hint">移动指针倾斜 · 点击空白处关闭</div>
</div></div>

<footer>
  <div class="wrap">卡面素材:「逐火者的命录」系列 · 取自 <a href="https://wiki.biligame.com/sr/%E9%80%90%E7%81%AB%E8%80%85%E7%9A%84%E5%91%BD%E8%B7%AF.exe">B 站星穹铁道 Wiki</a> · 版权归米哈游所有<br>
  分层:rembg(isnet-general-use)整卡抠像成前景层 + 徽记几何裁切,详见 <a href="https://github.com/xi-kari/amphoreus-skill-suite/blob/main/tools/make_layers.py">tools/make_layers.py</a></div>
</footer>

<script>
const CARDS=[
 {k:"aglaea",n:"阿格莱雅",t:"黄金的织者"},{k:"cerydra",n:"刻律德菈",t:"执棋的君主"},
 {k:"terrae",n:"丹恒",t:"掣地的伏龙"},{k:"phainon",n:"白厄",t:"负火的囚徒"},
 {k:"anaxa",n:"那刻夏",t:"殁世的学士"},{k:"cipher",n:"赛飞儿",t:"捷足的羁客"},
 {k:"hyacine",n:"风堇",t:"摇光的医师"},{k:"march7th",n:"三月七 / 长夜月",t:"隐秘的陌客"},
 {k:"castorice",n:"遐蝶",t:"死荫的侍女"},{k:"cyrene",n:"昔涟",t:"无瑕的真我"},
 {k:"mydei",n:"万敌",t:"亡国的王储"},{k:"hysilens",n:"海瑟音",t:"奏浪的剑骑"},
 {k:"tribbie",n:"缇宝",t:"命运的三子"},
 {k:"trailblazer-stelle",n:"开拓者·星",t:"创世的著者"},{k:"trailblazer-caelus",n:"开拓者·穹",t:"创世的著者"}];

function cardHTML(c){return `
 <div class="hcard" data-k="${c.k}">
  <div class="layers">
   <img class="l base" src="assets/layers/${c.k}-base.webp" alt="${c.n}底片层" loading="lazy">
   <img class="l front" src="assets/layers/${c.k}-front.webp" alt="${c.n}前景层" loading="lazy">
   <div class="l foil"></div>
   <div class="l spark"></div>
   <div class="l glare"></div>
   <div class="l rim"></div>
   <img class="coin" src="assets/symbols/${c.k}.png" alt="${c.n}徽记" loading="lazy">
  </div>
 </div>`}

const grid=document.getElementById('grid');
grid.innerHTML=CARDS.map(c=>`
 <div class="slot">${cardHTML(c)}
  <div class="cap"><b>${c.n}</b> <span class="t">${c.t}</span><code>${c.k.startsWith('trailblazer')?'amphoreus(总路由)':'amphoreus-'+c.k}</code></div>
 </div>`).join('');

function bind(card){
  const el=card, MAX=13;
  let raf=0,px=.5,py=.5;
  function apply(){
    raf=0;
    const dx=(px-.5)*2, dy=(py-.5)*2;
    el.style.setProperty('--ry',(dx*MAX)+'deg');
    el.style.setProperty('--rx',(-dy*MAX)+'deg');
    el.style.setProperty('--dx',dx.toFixed(3));
    el.style.setProperty('--dy',dy.toFixed(3));
    el.style.setProperty('--mx',(px*100)+'%');
    el.style.setProperty('--my',(py*100)+'%');
    el.style.setProperty('--fx',(30+dx*55)+'%');
    el.style.setProperty('--fy',(30+dy*55)+'%');
    el.style.setProperty('--o',Math.min(1,Math.hypot(dx,dy)*1.15+.15).toFixed(3));
  }
  el.addEventListener('pointermove',e=>{
    if(document.body.classList.contains('explode'))return;
    const r=el.getBoundingClientRect();
    px=(e.clientX-r.left)/r.width; py=(e.clientY-r.top)/r.height;
    el.classList.add('live');
    if(!raf)raf=requestAnimationFrame(apply);
  });
  el.addEventListener('pointerleave',()=>{
    el.classList.remove('live');
    ['--rx','--ry','--dx','--dy','--o'].forEach(v=>el.style.removeProperty(v));
  });
}
document.querySelectorAll('.hcard').forEach(bind);

/* 拆层视图 */
const eb=document.getElementById('explodeBtn');
eb.addEventListener('click',()=>{
  document.body.classList.toggle('explode');
  eb.classList.toggle('on');
});

/* 放大查看 */
const overlay=document.getElementById('overlay'),stage=document.getElementById('stage');
grid.addEventListener('click',e=>{
  const hc=e.target.closest('.hcard'); if(!hc)return;
  const c=CARDS.find(x=>x.k===hc.dataset.k);
  stage.innerHTML=cardHTML(c);
  const big=stage.querySelector('.hcard'); big.classList.add('still'); bind(big);
  overlay.classList.add('on');
});
overlay.addEventListener('click',e=>{if(!e.target.closest('.hcard'))overlay.classList.remove('on')});
addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('on')});
</script>
</body>
</html>
