name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 静态校验(卡 13/13 · 路由与表情资源清单 · 冻结场景 65 · UTF-8/LF)
        run: python -B skills/amphoreus/scripts/validate.py --root skills --wave all

      - name: 表情素材部署副本与网站资产一致
        run: python -B tools/package_stickers.py --check

      - name: 表情选择与输出行为测试
        run: python -B -m unittest discover -s tools/tests -p 'test_stickers.py'

      - name: 对话输出检查器回归
        run: python -B -m unittest discover -s tools/tests -p 'test_chat_output.py'

      - name: 适配层内容校验
        run: python -B adapters/build.py --check

      - name: 适配层零漂移(build.py 重跑后不得有任何改动或未跟踪文件)
        run: |
          python -B adapters/build.py
          drift="$(git status --porcelain -- adapters)"
          if [ -n "$drift" ]; then
            echo "adapters/ 存在漂移(手改产物或生成物未入库):"
            echo "$drift"
            git diff -- adapters
            exit 1
          fi
